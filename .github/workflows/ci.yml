name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      CI: "true"
      # Build imports the Neon client while collecting routes. These values
      # are never used to connect; production supplies the real secrets.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      AUTH_SECRET: build-secret-not-used-at-runtime-00
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on new high/critical advisories in shipped (prod) dependencies.
      # Fix by bumping the package, or pin in pnpm-workspace.yaml `overrides`.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
